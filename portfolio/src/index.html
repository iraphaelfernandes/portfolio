<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        const supportedLanguages = ['en', 'fr'];
        const pathLanguage = window.location.pathname.split('/')[1];
        let savedLanguage = null;
        let savedTheme = null;
        try {
          const storedLanguage = localStorage.getItem('lang');
          if (storedLanguage && supportedLanguages.includes(storedLanguage)) {
            savedLanguage = storedLanguage;
          }

          const storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark' || storedTheme === 'light') {
            savedTheme = storedTheme;
          }
        } catch {
          // Use the system preference when browser storage is unavailable.
        }

        const browserLanguage = navigator.language.toLowerCase().startsWith('fr') ? 'fr' : 'en';
        const language = supportedLanguages.includes(pathLanguage)
          ? pathLanguage
          : (savedLanguage ?? browserLanguage);
        document.documentElement.lang = language;

        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        document.documentElement.dataset['theme'] = savedTheme ?? (prefersDark ? 'dark' : 'light');

        if (window.location.pathname === '/') {
          window.location.replace(`/${language}`);
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
