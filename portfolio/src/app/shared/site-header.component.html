<header class="site-header">
  <div class="header-inner">
    <a class="brand" [href]="'/' + language()" [attr.aria-label]="site.ownerName + ' — home'">
      {{ site.ownerName }}
    </a>

    <nav
      class="desktop-nav"
      [attr.aria-label]="language() === 'en' ? 'Main navigation' : 'Navigation principale'"
    >
      <a [href]="'/' + language() + '/projects'">{{
        language() === 'en' ? 'Projects' : 'Projets'
      }}</a>
      <a [href]="'/' + language() + '/about'">{{ language() === 'en' ? 'About' : 'À propos' }}</a>
    </nav>

    <div class="header-controls">
      <app-language-toggle [language]="language()" (languageChange)="selectLanguage($event)" />
      <app-theme-toggle [language]="language()" />
      <button
        #menuButton
        #menuOrigin="cdkOverlayOrigin"
        cdkOverlayOrigin
        class="menu-button"
        type="button"
        [attr.aria-label]="
          menuOpen()
            ? language() === 'en'
              ? 'Close menu'
              : 'Fermer le menu'
            : language() === 'en'
              ? 'Open menu'
              : 'Ouvrir le menu'
        "
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        }
      </button>
    </div>
  </div>

  <ng-template
    cdk-connected-overlay
    [cdkConnectedOverlayOrigin]="menuOrigin"
    [cdkConnectedOverlayOpen]="menuOpen()"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayPositions]="mobileMenuPositions"
    cdkConnectedOverlayBackdropClass="menu-backdrop"
    (backdropClick)="closeMenu()"
  >
    <nav
      id="mobile-navigation"
      class="mobile-nav"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      tabindex="-1"
      [attr.aria-label]="language() === 'en' ? 'Main navigation' : 'Navigation principale'"
      (keydown.escape)="closeMenu()"
    >
      <a [href]="'/' + language() + '/projects'" (click)="closeMenu()">
        {{ language() === 'en' ? 'Projects' : 'Projets' }}
      </a>
      <a [href]="'/' + language() + '/about'" (click)="closeMenu()">
        {{ language() === 'en' ? 'About' : 'À propos' }}
      </a>
    </nav>
  </ng-template>
</header>
