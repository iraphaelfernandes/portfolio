<header class="site-header">
  <div class="header-inner">
    <a class="brand" [routerLink]="['/', language()]" [attr.aria-label]="site.ownerName">
      {{ site.ownerName }}
    </a>

    <nav class="desktop-nav" [attr.aria-label]="'nav.main' | transloco">
      <a [routerLink]="['/', language(), 'projects']">{{ 'nav.projects' | transloco }}</a>
      <a [routerLink]="['/', language(), 'about']">{{ 'nav.about' | transloco }}</a>
    </nav>

    <div class="header-controls">
      <app-language-toggle [language]="language()" (languageChange)="selectLanguage($event)" />
      <app-theme-toggle />
      <button
        #menuButton
        #menuOrigin="cdkOverlayOrigin"
        cdkOverlayOrigin
        class="menu-button"
        type="button"
        [attr.aria-label]="
          menuOpen() ? ('nav.closeMenu' | transloco) : ('nav.openMenu' | transloco)
        "
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        }
      </button>
    </div>
  </div>

  <ng-template
    cdk-connected-overlay
    [cdkConnectedOverlayOrigin]="menuOrigin"
    [cdkConnectedOverlayOpen]="menuOpen()"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayPositions]="mobileMenuPositions"
    cdkConnectedOverlayBackdropClass="menu-backdrop"
    (backdropClick)="closeMenu()"
  >
    <nav
      id="mobile-navigation"
      class="mobile-nav"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      tabindex="-1"
      [attr.aria-label]="'nav.main' | transloco"
      (keydown.escape)="closeMenu()"
    >
      <a [routerLink]="['/', language(), 'projects']" (click)="closeMenu()">
        {{ 'nav.projects' | transloco }}
      </a>
      <a [routerLink]="['/', language(), 'about']" (click)="closeMenu()">
        {{ 'nav.about' | transloco }}
      </a>
    </nav>
  </ng-template>
</header>
