<div class="language-toggle" role="group" [attr.aria-label]="'nav.language' | transloco">
  <button
    type="button"
    [attr.aria-pressed]="language() === 'en'"
    [class.selected]="language() === 'en'"
    (click)="selectLanguage('en')"
  >
    EN
  </button>
  <button
    type="button"
    [attr.aria-pressed]="language() === 'fr'"
    [class.selected]="language() === 'fr'"
    (click)="selectLanguage('fr')"
  >
    FR
  </button>
</div>
